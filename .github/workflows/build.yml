name: Build AutoPPTX Studio V2 (EXE & macOS)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: AutoPPTX_Studio_V2-Windows.exe
            build_type: windows
          - os: macos-latest
            artifact_name: AutoPPTX_Studio_V2-macOS.zip
            build_type: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm AutoPPTX_Studio_V2.spec

      - name: Prepare Windows artifact
        if: matrix.build_type == 'windows'
        shell: bash
        run: |
          mkdir -p release_out
          if [ -f "dist/AutoPPTX_Studio_V2.exe" ]; then
            cp "dist/AutoPPTX_Studio_V2.exe" "release_out/AutoPPTX_Studio_V2.exe"
          elif [ -f "dist/AutoPPTX_Studio_V2/AutoPPTX_Studio_V2.exe" ]; then
            cp "dist/AutoPPTX_Studio_V2/AutoPPTX_Studio_V2.exe" "release_out/AutoPPTX_Studio_V2.exe"
          else
            echo "Windows executable not found in dist/" && exit 1
          fi

      - name: Package macOS .app into ZIP
        if: matrix.build_type == 'macos'
        run: |
          mkdir -p release_out
          ditto -c -k --sequesterRessources --keepParent "dist/AutoPPTX_Studio_V2.app" "release_out/AutoPPTX_Studio_V2-macOS.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_out/*
          retention-days: 30

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
