name: Build Windows EXE & macOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm AutoPPTX_Studio_V2.spec

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPPTX_Studio_V2_Windows_EXE
          path: dist/AutoPPTX_Studio_V2.exe

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller

      - name: Build macOS App
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Compress macOS Output
        run: |
          cd dist
          if [ -d "AutoPPTX_Studio_V2.app" ]; then
            zip -r AutoPPTX_Studio_V2_macOS.zip AutoPPTX_Studio_V2.app
          else
            zip -r AutoPPTX_Studio_V2_macOS.zip AutoPPTX_Studio_V2
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPPTX_Studio_V2_macOS
          path: dist/AutoPPTX_Studio_V2_macOS.zip

