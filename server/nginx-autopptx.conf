# AutoPPTX — kho tài nguyên. Được include trong server{} của talent.goldenasia.vn
# qua dòng `include /etc/nginx/snippets/talent-*.conf;` (file này cài thành
# /etc/nginx/snippets/talent-autopptx.conf bởi server/setup.sh).
#
# proxy_pass KHÔNG kèm URI: nginx chuyển nguyên đường dẫn gốc (giữ đúng % của tên
# file tiếng Việt); máy chủ Python tự bỏ tiền tố /pptx (AP_URL_PREFIX).

location = /pptx {
    return 301 /pptx/;
}

location = /pptx/api/login {
    limit_req zone=pptxlogin burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /pptx/ {
    client_max_body_size 64m;
    proxy_request_buffering off;
    # Tải .zip nhiều báo cáo: máy chủ ghi luồng, không để nginx gom vào file tạm.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header X-Robots-Tag "noindex" always;
}

# File kết quả xuất PPTX trên web (thường vài trăm MB) — cũng chỉ qua X-Accel-Redirect.
location /pptx-jobs/ {
    internal;
    alias /var/lib/autopptx/jobs/;
    add_header Cache-Control "private, no-store";
    add_header X-Robots-Tag "noindex" always;
}

# File thật (avatar, nền, Excel) do nginx gửi sau khi API đã kiểm quyền
# (X-Accel-Redirect). Không truy cập thẳng được từ ngoài.
location /pptx-store/ {
    internal;
    alias /var/lib/autopptx/store/;
    add_header Cache-Control "private, no-cache";
    add_header X-Robots-Tag "noindex" always;
}
